# Backend em pipeline: toda segunda-feira (ou quando você clicar em "Run workflow")
# o GitHub baixa os dados atualizados da PokéAPI, gera data/pokedex.json e data/pokedex.js
# e faz commit se algo mudou. O GitHub Pages publica o site sozinho a cada commit na main.
name: Atualizar dados da Pokédex

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "server/**", "app.js", "index.html", ".github/workflows/dados.yml"]

permissions:
  contents: write

jobs:
  dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar dados a partir da PokéAPI
        run: npm run build:data

      - name: Conferir se o site e o backend continuam válidos
        run: |
          node --check app.js
          node --check server/server.js
          node -e "const d=require('./data/pokedex.json'); if (d.pokemon.length !== 151) throw new Error('esperava 151 Pokémon');"
          (npm start &) && sleep 2
          curl -fsS http://localhost:3000/api/pokemon/pikachu > /dev/null
          curl -fsS http://localhost:3000/ > /dev/null

      - name: Commit se os dados mudaram
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data; then
            echo "Dados já estão atualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "dados: atualização automática da PokéAPI"
          git push
